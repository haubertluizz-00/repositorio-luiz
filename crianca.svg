  <!-- pescoço -->
  <rect x="190" y="215" width="20" height="20" fill="#F3C6A5"/>

  <!-- cabeça -->
  <circle cx="200" cy="180" r="55" fill="#F3C6A5"/>

  <!-- cabelo -->
  <path d="M 148 175 Q 150 120 200 115 Q 250 120 252 175 Q 245 145 220 140 Q 205 155 190 145 Q 175 155 160 148 Q 152 158 148 175 Z" fill="#4A2E1F"/>

  <!-- orelhas -->
  <ellipse cx="147" cy="185" rx="7" ry="10" fill="#F3C6A5"/>
  <ellipse cx="253" cy="185" rx="7" ry="10" fill="#F3C6A5"/>

  <!-- olhos -->
  <circle cx="182" cy="180" r="6" fill="#2B2B2B"/>
  <circle cx="218" cy="180" r="6" fill="#2B2B2B"/>
  <circle cx="184" cy="178" r="2" fill="#FFF"/>
  <circle cx="220" cy="178" r="2" fill="#FFF"/>

