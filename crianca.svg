  <path d="M 210 168 Q 218 164 226 168" stroke="#4A2E1F" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- bochechas -->
  <circle cx="170" cy="200" r="7" fill="#F49BA4" opacity="0.7"/>
  <circle cx="230" cy="200" r="7" fill="#F49BA4" opacity="0.7"/>

  <!-- nariz -->
  <path d="M 200 190 Q 197 200 200 205" stroke="#C99A7C" stroke-width="2" fill="none" stroke-linecap="round"/>

