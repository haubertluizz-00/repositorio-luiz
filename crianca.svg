  <path d="M 150 240 Q 200 220 250 240 L 245 340 Q 200 355 155 340 Z" fill="#E85A4F"/>
  <!-- listras da camisa -->
  <path d="M 155 265 Q 200 258 245 265" stroke="#FFF" stroke-width="4" fill="none"/>
  <path d="M 155 295 Q 200 288 245 295" stroke="#FFF" stroke-width="4" fill="none"/>

  <!-- braços -->
  <path d="M 155 245 Q 130 285 135 325" stroke="#F3C6A5" stroke-width="18" fill="none" stroke-linecap="round"/>
  <path d="M 245 245 Q 270 285 265 325" stroke="#F3C6A5" stroke-width="18" fill="none" stroke-linecap="round"/>

  <!-- mãos -->
  <circle cx="135" cy="328" r="11" fill="#F3C6A5"/>
