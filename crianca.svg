<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <radialGradient id="sky" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#FFF4C2"/>
      <stop offset="100%" stop-color="#FFD48A"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8FD37A"/>
      <stop offset="100%" stop-color="#5FA84A"/>
    </linearGradient>
  </defs>

  <!-- fundo -->
  <rect width="400" height="500" fill="url(#sky)"/>
  <rect y="380" width="400" height="120" fill="url(#ground)"/>

  <!-- sol -->
  <circle cx="330" cy="80" r="34" fill="#FFC93A"/>
  <g stroke="#FFC93A" stroke-width="4" stroke-linecap="round">
    <line x1="330" y1="20" x2="330" y2="35"/>
    <line x1="330" y1="125" x2="330" y2="140"/>
    <line x1="270" y1="80" x2="285" y2="80"/>
    <line x1="375" y1="80" x2="390" y2="80"/>
    <line x1="288" y1="38" x2="298" y2="48"/>
    <line x1="362" y1="112" x2="372" y2="122"/>
    <line x1="288" y1="122" x2="298" y2="112"/>
    <line x1="362" y1="48" x2="372" y2="38"/>
  </g>

  <!-- nuvem -->
  <g fill="#FFFFFF" opacity="0.9">
